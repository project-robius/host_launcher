[package]
name = "host_launcher"
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
description = "A home screen launcher-style app that hosts isolated Splash mini-apps, built with Makepad + Robius."
edition = "2024"
homepage = "https://robius.rs/"
keywords = ["launcher", "splash", "makepad", "robius"]
license = "MIT"
readme = "README.md"
categories = ["gui"]
repository = "https://github.com/project-robius/host_launcher"
version = "0.1.0"
# `cargo run` should launch the launcher, not the fake_acp test agent.
default-run = "host_launcher"

[dependencies]
makepad-widgets = { git = "https://github.com/kevinaboos/makepad", branch = "splash_improvements", features = ["serde"] }
# Read-only syntax-highlighted view of a mini-app's source (App Info → View
# source). Same fork/branch as makepad-widgets — a different rev would pull a
# second copy of the widget crate.
makepad-code-editor = { git = "https://github.com/kevinaboos/makepad", branch = "splash_improvements" }
# For local makepad hacking, swap the git deps above (and makepad-test below)
# for path deps on a checkout with splash_improvements checked out — ALL THREE
# must point at the SAME tree or the widget/editor/test types won't match:
# makepad-widgets = { path = "../makepad-si/widgets", features = ["serde"] }
# makepad-code-editor = { path = "../makepad-si/code_editor" }

## Including this crate automatically configures all `robius-*` crates to work with Makepad.
robius-use-makepad = "0.1.1"
robius-directories = { git = "https://github.com/project-robius/robius" }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- optional: the in-process octos agent backend (feature `agent-octos`) ---
# Rev-pinned: octos moves fast; bump deliberately. These compile the agent
# core (LLM providers, tool registry, episodic store) INTO the launcher so no
# child process is needed — required on iOS, where exec() is prohibited.
octos-agent  = { git = "https://github.com/octos-org/octos", rev = "e17b47b5d3dadf43b9b1a39415f91812e8d464d6", default-features = false, optional = true }
octos-core   = { git = "https://github.com/octos-org/octos", rev = "e17b47b5d3dadf43b9b1a39415f91812e8d464d6", optional = true }
octos-llm    = { git = "https://github.com/octos-org/octos", rev = "e17b47b5d3dadf43b9b1a39415f91812e8d464d6", optional = true }
octos-memory = { git = "https://github.com/octos-org/octos", rev = "e17b47b5d3dadf43b9b1a39415f91812e8d464d6", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
chrono = { version = "0.4", optional = true }

[features]
# Run the octos agent in-process instead of spawning `octos acp`. The
# HOST_LAUNCHER_AGENT_CMD env override still wins (and is how tests inject the
# offline fake agent even in agent-octos builds).
agent-octos = ["dep:octos-agent", "dep:octos-core", "dep:octos-llm", "dep:octos-memory", "dep:tokio", "dep:chrono"]
# Deploy the dialect guide persistently on the agent side (octos bootstrap
# file) and send slim prompts instead of inlining ~6KB per generation.
agent-skills = []
# Let the agent research with its tools (web search/fetch) before answering,
# baking found data into the app as constants.
agent-tools = []

[dev-dependencies]
makepad-test = { git = "https://github.com/kevinaboos/makepad", branch = "splash_improvements" }
# makepad-test = { path = "../makepad-si/libs/makepad_test" }

[profile.release]
debug = false
strip = "symbols"

## An optimized profile for development, with full debug info and assertions.
[profile.debug-opt]
inherits = "dev"
opt-level = 3

## An optimized release profile with thin LTO.
[profile.release-lto]
inherits = "release"
lto = "thin"

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unnameable_types = "warn"
unused_import_braces = "warn"

[lints.clippy]
blocks_in_conditions = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
module_name_repetitions = "allow"
needless_late_init = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
used_underscore_binding = "allow"
