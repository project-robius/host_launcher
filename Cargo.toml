[package]
name = "host_launcher"
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
description = "A home screen launcher-style app that hosts isolated Splash mini-apps, built with Makepad + Robius."
edition = "2024"
homepage = "https://robius.rs/"
keywords = ["launcher", "splash", "makepad", "robius"]
license = "MIT"
readme = "README.md"
categories = ["gui"]
repository = "https://github.com/project-robius/host_launcher"
version = "0.1.0"
# `cargo run` should launch the launcher, not the fake_acp test agent.
default-run = "host_launcher"

[dependencies]
# The host-services bridge and its VM fixes are upstream now
# (makepad/makepad#1181), so these track makepad/makepad again. For local
# makepad hacking, swap ALL THREE (incl. makepad-test below) to path deps on
# the SAME tree, or the widget/editor/test types won't match:
# makepad-widgets = { path = "../makepad-host-services/widgets", features = ["serde"] }
# makepad-code-editor = { path = "../makepad-host-services/code_editor" }
makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev", features = ["serde"] }
# Read-only syntax-highlighted view of a mini-app's source (App Info → View
# source). Same fork/branch as makepad-widgets — a different rev would pull a
# second copy of the widget crate.
makepad-code-editor = { git = "https://github.com/makepad/makepad", branch = "dev" }

## Including this crate automatically configures all `robius-*` crates to work with Makepad.
robius-use-makepad = "0.1.1"
robius-directories = { git = "https://github.com/project-robius/robius" }
# Platform brokers behind the mini-app permission system (docs/PERMISSIONS.md):
# geolocation, open-in-browser, system file picker, share sheet, biometric auth.
robius-location = { git = "https://github.com/project-robius/robius" }
robius-open = { git = "https://github.com/project-robius/robius" }
robius-file-picker = { git = "https://github.com/project-robius/robius" }
robius-share = { git = "https://github.com/project-robius/robius" }
robius-authentication = { git = "https://github.com/project-robius/robius" }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- optional: the in-process octos agent backend (feature `agent-embedded`) ---
# Rev-pinned: octos moves fast; bump deliberately. These compile the agent
# core (LLM providers, tool registry, episodic store) INTO the launcher so no
# child process is needed — required on iOS, where exec() is prohibited.
# TEMPORARY: the fork/branch of octos-org/octos#1914, which exposes
# `AcpCommand::factory()` — the agent factory `octos acp` serves. Repin to an
# upstream rev once that lands; a branch dep floats, and this one must not.
octos-agent  = { git = "https://github.com/project-robius/octos", branch = "acp-embedding-seam", default-features = false, optional = true }
octos-core   = { git = "https://github.com/project-robius/octos", branch = "acp-embedding-seam", optional = true }
# The CLI, as a LIBRARY. This is where the agent assembly lives — provider
# fallbacks, auth store, keychain markers, MCP, plugins, skills, and the config
# precedence rules. Linking it is what stops the in-process backend being a
# hand-written subset that drifts from what `octos acp` actually does.
octos-cli    = { git = "https://github.com/project-robius/octos", branch = "acp-embedding-seam", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
chrono = { version = "0.4", optional = true }

# Each of these changes how the AGENT behaves; none affect the launcher's own
# UI. All off by default, so a plain `cargo build` spawns `octos acp` as a child
# process with prompts that carry their own guide and no research tools.
[features]

# Link the octos agent INTO this binary and run it on a thread, instead of
# spawning `octos acp` as a child process. Same agent either way — this picks
# how it runs, not what it is. The only local option on iOS, where exec() is
# prohibited. HOST_LAUNCHER_AGENT_CMD still wins over it, which is how the
# tests inject the offline fake agent even in these builds.
agent-embedded = ["dep:octos-agent", "dep:octos-core", "dep:octos-cli", "dep:tokio", "dep:chrono"]

# Install the Splash dialect guide ON THE AGENT once — octos's bootstrap file
# for the child process, the system prompt for the embedded one — so each
# prompt can point at it instead of inlining ~6KB of guide per generation.
agent-persistent-guide = []

# Let the agent research before it writes: web search and fetch, with what it
# finds baked into the generated app as constants. Gates the prompt policy and,
# for the embedded agent, whether the tools are registered at all.
agent-research = []

[dev-dependencies]
makepad-test = { git = "https://github.com/makepad/makepad", branch = "dev" }
# makepad-test = { path = "../makepad-host-services/libs/makepad_test" }

[profile.release]
debug = false
strip = "symbols"

## An optimized profile for development, with full debug info and assertions.
[profile.debug-opt]
inherits = "dev"
opt-level = 3

## An optimized release profile with thin LTO.
[profile.release-lto]
inherits = "release"
lto = "thin"

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unnameable_types = "warn"
unused_import_braces = "warn"

[lints.clippy]
blocks_in_conditions = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
module_name_repetitions = "allow"
needless_late_init = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
used_underscore_binding = "allow"
